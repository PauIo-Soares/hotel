<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Clientes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Gerenciamento de Clientes</h1>

    <div th:if="${mensagem}"
         th:class="${mensagem.contains('sucesso') or mensagem.contains('Sucesso') ? 'mensagem sucesso' : 'mensagem erro'}">
        <p th:text="${mensagem}"></p>
    </div>

    <h2>Cadastrar/Atualizar Cliente</h2>
    <form th:action="@{/cliente/criar}" th:object="${Cliente}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" th:field="*{cpf}" required>
        </div>

        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required>
        </div>

        <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" th:field="*{telefone}" required>
        </div>

        <div class="form-group">
            <label for="cidadeOrigem">Cidade de Origem:</label>
            <input type="text" id="cidadeOrigem" th:field="*{cidadeOrigem}" required>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-primary">Cadastrar</button>
            <button type="submit" formaction="/cliente/atualizar" class="btn-warning">Atualizar</button>
        </div>
    </form>

    <div class="section-divider"></div>

    <h2>Buscar Cliente por CPF</h2>
    <form th:action="@{/cliente/buscar}" method="post" class="form-inline">
        <div class="form-group">
            <label for="cpfBusca">CPF:</label>
            <input type="text" id="cpfBusca" name="cpf" required>
        </div>
        <button type="submit" class="btn-info">Buscar</button>
    </form>

    <div th:if="${resultadoBusca}" class="resultado-busca">
        <h3>Resultado da Busca</h3>
        <p><strong>ID:</strong> <span th:text="${resultadoBusca.id}"></span></p>
        <p><strong>CPF:</strong> <span th:text="${resultadoBusca.cpf}"></span></p>
        <p><strong>Nome:</strong> <span th:text="${resultadoBusca.nome}"></span></p>
        <p><strong>Telefone:</strong> <span th:text="${resultadoBusca.telefone}"></span></p>
        <p><strong>Cidade de Origem:</strong> <span th:text="${resultadoBusca.cidadeOrigem}"></span></p>
    </div>

    <div class="section-divider"></div>

    <h2>Excluir Cliente</h2>
    <form th:action="@{/cliente/excluir}" method="post" class="form-inline">
        <div class="form-group">
            <label for="cpfExcluir">CPF:</label>
            <input type="text" id="cpfExcluir" name="cpf" required>
        </div>
        <button type="submit" class="btn-danger">Excluir</button>
    </form>

    <div class="section-divider"></div>

    <h2>Listar Todos os Clientes</h2>
    <form th:action="@{/cliente/listar}" method="post">
        <button type="submit" class="btn-success">Listar Todos</button>
    </form>

    <div th:if="${listaClientes}">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>CPF</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Cidade de Origem</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cliente : ${listaClientes}">
                <td th:text="${cliente.id}"></td>
                <td th:text="${cliente.cpf}"></td>
                <td th:text="${cliente.nome}"></td>
                <td th:text="${cliente.telefone}"></td>
                <td th:text="${cliente.cidadeOrigem}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/}" class="voltar-link">← Voltar para o Menu Principal</a>
</div>
</body>
</html>
