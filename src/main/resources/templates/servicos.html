<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Serviços</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Gerenciamento de Serviços</h1>

    <div th:if="${mensagem}"
         th:class="${mensagem.contains('sucesso') or mensagem.contains('Sucesso') ? 'mensagem sucesso' : 'mensagem erro'}">
        <p th:text="${mensagem}"></p>
    </div>

    <h2>Cadastrar/Atualizar Serviço</h2>
    <form th:action="@{/servico/criar}" th:object="${servico}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição:</label>
            <textarea id="descricao" th:field="*{descricao}" required></textarea>
        </div>

        <div class="form-group">
            <label for="valor">Valor:</label>
            <input type="text" id="valor" th:field="*{valor}" placeholder="0.00" required>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-primary">Cadastrar</button>
            <button type="submit" formaction="/servico/atualizar" class="btn-warning">Atualizar</button>
        </div>
    </form>

    <div class="section-divider"></div>

    <h2>Buscar Serviço por ID</h2>
    <form th:action="@{/servico/buscar}" method="post" class="form-inline">
        <div class="form-group">
            <label for="idBusca">ID:</label>
            <input type="number" id="idBusca" name="id" required>
        </div>
        <button type="submit" class="btn-info">Buscar</button>
    </form>

    <div th:if="${resultadoBusca}" class="resultado-busca">
        <h3>Resultado da Busca</h3>
        <p><strong>ID:</strong> <span th:text="${resultadoBusca.id}"></span></p>
        <p><strong>Nome:</strong> <span th:text="${resultadoBusca.nome}"></span></p>
        <p><strong>Descrição:</strong> <span th:text="${resultadoBusca.descricao}"></span></p>
        <p><strong>Valor:</strong> R$ <span th:text="${resultadoBusca.valor}"></span></p>
    </div>

    <div class="section-divider"></div>

    <h2>Excluir Serviço</h2>
    <form th:action="@{/servico/excluir}" method="post" class="form-inline">
        <div class="form-group">
            <label for="idExcluir">ID:</label>
            <input type="number" id="idExcluir" name="id" required>
        </div>
        <button type="submit" class="btn-danger">Excluir</button>
    </form>

    <div class="section-divider"></div>

    <h2>Listar Todos os Serviços</h2>
    <form th:action="@{/servico/listar}" method="post">
        <button type="submit" class="btn-success">Listar Todos</button>
    </form>

    <div th:if="${listaServicos}">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Valor</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="servico : ${listaServicos}">
                <td th:text="${servico.id}"></td>
                <td th:text="${servico.nome}"></td>
                <td th:text="${servico.descricao}"></td>
                <td th:text="'R$ ' + ${servico.valor}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/}" class="voltar-link">← Voltar para o Menu Principal</a>
</div>
</body>
</html>
